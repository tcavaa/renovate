---
# cPanel Git Version Control runs these on "Deploy HEAD Commit" (Manage → Pull or Deploy).
# No login shell is needed: cPanel runs the tasks as the account user, from the repository
# directory. deploy/cpanel.sh finds the Node.js app's environment under ~/nodevenv, installs,
# builds the standalone server, migrates and asks Passenger to restart. Server variables come
# from <repository>/.env, created once in File Manager (it is git-ignored). DOCROOT is the
# subdomain's document root: uploads are kept there so Apache serves them straight from disk.
deployment:
  tasks:
    - export DOCROOT="${DOCROOT:-$HOME/renovate.rretrocar.ge}"
    - /bin/bash -c 'cd "$(git rev-parse --show-toplevel 2>/dev/null || echo "$HOME/renovate")" && bash deploy/cpanel.sh'
