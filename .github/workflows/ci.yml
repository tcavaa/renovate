name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy (deploy.yml) re-runs these checks on the tag before it ships it. A workflow can only
  # be called with `uses:` when it declares this trigger; without it the deploy's verify job
  # was refused and no tag could ever deploy.
  workflow_call:

# Called from Deploy, `github.ref` is the tag being deployed, so this group is that tag's own
# and never the caller's (`deploy`): a called workflow in its caller's group would wait for the
# caller for ever. Keep `github.workflow` out of the name — when called, it is the caller's.
# Read-only token: this runs on pull requests from forks of a public repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder configuration so `lib/env.ts` validates and `next build` can run without a
  # database. Nothing here is a real secret.
  NODE_ENV: test
  DATABASE_HOST: 127.0.0.1
  DATABASE_USER: ci
  DATABASE_PASSWORD: ci
  DATABASE_NAME: renovate_ci
  AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  LOG_FILE: 'false'

jobs:
  checks:
    name: Type-check, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in production dependencies (critical fails the build)
        run: pnpm audit --prod --audit-level critical

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests (with coverage gate)
        run: pnpm test -- --coverage

      - name: Floor-plan parser tests
        run: pnpm test:parser

      - name: Plan solver tests
        run: pnpm test:solver

      - name: Production build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
