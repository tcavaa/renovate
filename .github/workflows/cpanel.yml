name: cPanel build

# Builds the standalone server on GitHub's runners and publishes it to the `cpanel` branch,
# which the cPanel Git Version Control repository checks out. The shared host cannot build the
# app itself — its per-account memory cap kills `pnpm install` and `next build` — so the branch
# carries the source tree plus `.next/standalone` (marked with `.next/standalone/.prebuilt`),
# and deploy/cpanel.sh runs in release mode there: copy public/, link uploads, migrate, sync the
# catalogue with the model manifests, restart.
#
# Runs after CI has passed on main. Each publish is one commit on top of the previous one, so
# cPanel's "Update from Remote" always fast-forwards. NEXT_PUBLIC_APP_URL is baked into the
# client bundle at build time: set the repository variable NEXT_PUBLIC_APP_URL to change it.
#
# The repository is public, so this workflow must never build code from someone else. A CI run
# on a fork's pull request also "completes", and `branches: [main]` matches the head branch's
# *name* — a fork's own branch called main passes it. Hence the job's `if` takes only CI runs
# started by a push to this repository's main (or a manual run, which needs write access).
# The token is not left in .git/config (`persist-credentials: false`), so nothing `pnpm install`
# or the build runs can read it; only the publish step gets it. Actions are pinned to commits.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  # Placeholders so lib/env.ts validates while the build collects page data; every page is
  # rendered on request, so nothing here reaches the built output or a database.
  DATABASE_HOST: 127.0.0.1
  DATABASE_USER: ci
  DATABASE_PASSWORD: ci
  DATABASE_NAME: renovate_ci
  AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://renovate.rretrocar.ge' }}

jobs:
  publish:
    name: Build and publish the cpanel branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: NODE_ENV=development pnpm install --frozen-lockfile

      - name: Build
        # Sentry (docs/operations.md#errors-go-to-sentry): the DSN is baked into the bundle; the
        # token uploads the source maps. Either missing, the build goes on without that part. The
        # DSN is exported only when the variable has a value: Next bakes in an empty one too, and
        # that would override a DSN in the host's own .env even for the server.
        run: |
          set -euo pipefail
          if [ -n "${DSN_VARIABLE:-}" ]; then export NEXT_PUBLIC_SENTRY_DSN="${DSN_VARIABLE}"; fi
          pnpm build
        env:
          DSN_VARIABLE: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the standalone server
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          # public/ is copied and uploads linked on the server by deploy/cpanel.sh.
          rm -rf .next/standalone/public
          # The catalogue seed as one plain-node file (drizzle, mysql2 and dotenv bundled in),
          # so deploy/cpanel.sh can make the database match the model manifests on a host
          # that has no tsx and no node_modules of its own.
          pnpm deploy:bundle-seed
          # The upload recipe for the models stored before uploads were optimized (sharp stays
          # outside the bundle: the standalone server's node_modules has it).
          pnpm deploy:bundle-optimize
          printf '%s\n%s\n' "${BUILT_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .next/standalone/.prebuilt
          du -sh .next/standalone
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Publish to the cpanel branch
        # The checkout kept no credentials; the token is handed to git for this step only.
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch's tree is this commit's tree plus the built server; its history is its
          # own — one commit per publish on top of the last, so pulls fast-forward.
          git add -f .next/standalone
          TREE="$(git write-tree)"
          PARENT=""
          if git -c http.https://github.com/.extraheader="${AUTH}" fetch --depth=1 origin cpanel 2>/dev/null; then
            PARENT="$(git rev-parse --verify FETCH_HEAD)"
          fi
          SUBJECT="$(git log -1 --pretty=%s HEAD)"
          COMMIT="$(git commit-tree "${TREE}" ${PARENT:+-p "${PARENT}"} -m "cPanel build of ${BUILT_SHA::7}: ${SUBJECT}")"
          git -c http.https://github.com/.extraheader="${AUTH}" push origin "${COMMIT}:refs/heads/cpanel"
          echo "published ${COMMIT} to cpanel"
