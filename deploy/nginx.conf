# Nginx site for რემონტი.ge — TLS termination, compression, static files, proxy to PM2.
#
# Install: copy to /etc/nginx/sites-available/renovate and symlink into sites-enabled.
# Replace `example.com` and `/var/www/renovate` with the real values. Certificates come from
# certbot (`certbot --nginx -d example.com -d www.example.com`), which fills the ssl_ lines.
#
# The app sets its own security headers (CSP, HSTS, …) — do not duplicate them here.

upstream renovate_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Plain HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Floor-plan uploads are allowed up to 12 MB by the app; give the proxy some headroom.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/wasm image/svg+xml font/woff2 model/gltf-binary application/octet-stream;

    # The current release's public/ directory. `deploy/deploy.sh` keeps this symlink fresh.
    set $public_root /var/www/renovate/current/public;

    # Static files straight from disk — models, textures, uploads and samples never change
    # under the same name, so long client caching is safe (the app sets the same policy).
    location ~ ^/(models|textures|samples)/ {
        root $public_root;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri @app;
    }
    location /uploads/ {
        root $public_root;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # Build output is content-hashed; cache it for a year.
    location /_next/static/ {
        proxy_pass http://renovate_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://renovate_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app's rate limiter reads the first X-Forwarded-For entry as the client IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
